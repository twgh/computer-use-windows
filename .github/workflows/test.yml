name: test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Windows-only by design: the helper imports pywin32 and calls user32, and
    # the stdio stage exercises Win32 window and gate behaviour. There is no
    # Linux/macOS job because there is nothing to run there.
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22 # package.json requires >=20

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        working-directory: project
        run: npm ci

      - name: Create the runtime venv
        # Locally the server self-bootstraps this on the first tool call, but the
        # unit tests import windows_helper.py directly — nothing would trigger
        # it, and the runner would fall back to an interpreter without pywin32.
        # Deliberately not cached: a restored venv whose interpreter points at
        # another runner's absolute path fails in a way that looks like a code
        # regression, and building it costs well under a minute.
        run: |
          python -m venv project/.runtime/venv
          project/.runtime/venv/Scripts/python.exe -m pip install --upgrade pip
          project/.runtime/venv/Scripts/python.exe -m pip install -r project/runtime/requirements.txt

      - name: Run the test pipeline
        # build + typecheck + skill structure + version-site consistency +
        # Python and TS unit tests + a real MCP stdio session.
        # No desktop is attached to a GitHub runner, so the stdio stage may
        # report fewer monitors; its assertions are environment-tolerant by
        # design. It injects no input and touches no user window.
        run: python scripts/run_tests.py

      - name: Package smoke test
        # run_tests.py checks the allowlist and the bundle-entry rules against
        # the real repo, but never writes the archive itself; before this step
        # a packaging breakage only surfaced at step 4 of the release flow.
        # Producing the zip here validates the last mile on every push. The
        # artifact stays in the runner temp dir and is not uploaded.
        run: python scripts/package_skill.py -o "$env:TEMP/computer-use-windows-smoke.zip"
